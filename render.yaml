services:
  - type: web
    name: drastha
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DRASTHA_ROOT
        value: /app
      - key: DRASTHA_WEB
        value: /app/web/dist
      - key: DRASTHA_DB
        value: /tmp/drastha.db
